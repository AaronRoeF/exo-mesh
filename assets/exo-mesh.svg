<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600"
     role="img" aria-labelledby="exo-mesh-title exo-mesh-desc">
  <title id="exo-mesh-title">exo-mesh: four channels resolved into one person record</title>
  <desc id="exo-mesh-desc">Data-flow diagram. Mail, calendar, iMessage and contacts are pulled into local replicas on your own machine, where a resolver joins them by email, phone and name into a mesh database holding one row per person, which the command line and MCP server read. Arrows run inbound only; nothing leaves the machine.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>
  <text x="40" y="44" fill="#7a8399" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.14em">EXO-MESH · LOCAL-FIRST DATA FLOW</text>
  <text x="40" y="76" fill="#2d3142" font-size="28" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif">Four channels in. One person out.</text>
  <text x="40" y="100" fill="#4f5d75" font-size="12" font-family="'Geist', -apple-system, 'Helvetica Neue', Arial, sans-serif">Context an agent can read, on a disk you own. Nothing is sent anywhere to answer it.</text>
